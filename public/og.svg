  <circle cx="530" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="550" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="570" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="590" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="610" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="630" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="650" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="670" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="690" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="710" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="730" cy="562" r="6" fill="#F5F5F7"/>
