  <circle cx="790" cy="562" r="6" fill="#F5F5F7"/>
  <circle cx="810" cy="562" r="6" fill="#F5F5F7"/>

  <!-- Left side wordmark -->
  <text x="120" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="6" fill="#86868B" transform="rotate(-90, 120, 290)">NAKED BILL</text>

  <!-- Left tagline -->
  <text x="90" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-1" fill="#1D1D1F" transform="rotate(-90, 90, 295)">What does your life cost?</text>
